<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Muzeycha 3D Galereya</title>
  <style>
    body { margin: 0; overflow: hidden; background: #0e0915; font-family: sans-serif; touch-action: none; }
    #canvas-container { width: 100vw; height: 100vh; display: none; }
    #ui {
      position: absolute; top: 15px; width: 100%; text-align: center;
      color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.8); pointer-events: none; z-index: 10; display: none;
    }
    h1 { font-size: 18px; margin: 0; color: #ffdfa9; }
    p { font-size: 11px; opacity: 0.9; margin-top: 3px; }
    
    /* Virtual Joystick */
    #joystick-zone {
      position: absolute; bottom: 30px; left: 25px; width: 110px; height: 110px;
      background: rgba(255, 255, 255, 0.2); border: 2px solid rgba(255, 255, 255, 0.4);
      border-radius: 50%; touch-action: none; z-index: 10; display: none;
    }
    #joystick-knob {
      position: absolute; top: 32px; left: 32px; width: 45px; height: 45px;
      background: #ffdfa9; border-radius: 50%; box-shadow: 0 0 10px rgba(0,0,0,0.5); pointer-events: none;
    }

    /* Parol Kirish Ekrani */
    #password-screen {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      background: #120c1f; display: flex; flex-direction: column;
      justify-content: center; align-items: center; z-index: 100; color: white;
    }
    #password-screen h2 { margin-bottom: 15px; color: #ffdfa9; font-size: 20px; text-shadow: 0 0 10px rgba(255,223,169,0.4); }
    #password-input {
      padding: 12px 20px; font-size: 16px; border-radius: 8px; border: 2px solid #ffdfa9;
      background: #221636; color: white; text-align: center; outline: none; margin-bottom: 12px;
    }
    #submit-btn {
      padding: 10px 25px; font-size: 16px; border: none; border-radius: 8px;
      background: #ffdfa9; color: #120c1f; font-weight: bold; cursor: pointer; transition: 0.2s;
    }
    #submit-btn:active { transform: scale(0.95); }
    #error-msg { color: #ff4d4d; margin-top: 10px; font-size: 13px; font-weight: bold; display: none; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

  <div id="password-screen">
    <h2>🏛 Muzeycha 3D Galereyasi</h2>
    <input type="password" id="password-input" placeholder="Parolni kiriting..." autofocus>
    <button id="submit-btn" onclick="checkPassword()">KIRISH</button>
    <div id="error-msg">Noto'g'ri parol! Qayta urining.</div>
  </div>

  <div id="ui">
    <h1>🏛 Shinam 3D Galereya Muzeyi</h1>
    <p>Joystick orqali yuring | Ekran orqali kamerani aylanib eksponatlarni ko'ring</p>
  </div>
  
  <div id="joystick-zone">
    <div id="joystick-knob"></div>
  </div>

  <div id="canvas-container"></div>

  <!-- Sokin Fon Musiqasi -->
  <audio id="bg-music" loop src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=relaxing-piano-112221.mp3"></audio>

  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      Telegram.WebApp.ready();
      Telegram.WebApp.expand();
    }

    const correctPassword = "muzey2026";
    let bgMusic = document.getElementById("bg-music");
    let controls;

    function checkPassword() {
      const input = document.getElementById("password-input").value;
      if (input === correctPassword) {
        document.getElementById("password-screen").style.display = "none";
        document.getElementById("canvas-container").style.display = "block";
        document.getElementById("ui").style.display = "block";
        document.getElementById("joystick-zone").style.display = "block";
        
        bgMusic.play().catch(e => console.log("Ovoz ruxsati berildi"));
        init3D();
      } else {
        document.getElementById("error-msg").style.display = "block";
      }
    }

    function init3D() {
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0xf5efe6);

      const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 5, 8);

      const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      document.getElementById('canvas-container').appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.maxPolarAngle = Math.PI / 2 - 0.05;
      controls.minDistance = 1.8;
      controls.maxDistance = 14;

      // YORUG'LIKLAR
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.95);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xfff5ea, 0.6);
      dirLight.position.set(10, 20, 10);
      scene.add(dirLight);

      // POL
      const floorMat = new THREE.MeshBasicMaterial({ color: 0xe6d7c3 });
      const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), floorMat);
      floor.rotation.x = -Math.PI / 2;
      scene.add(floor);

      // COLLISION RO'YXATI
      const wallBoxes = [];
      const wallMatMain = new THREE.MeshBasicMaterial({ color: 0xfff9ef });
      const wallMatPink = new THREE.MeshBasicMaterial({ color: 0xf8bbd0 });
      const wallMatBlue = new THREE.MeshBasicMaterial({ color: 0xb3e5fc });
      const wallMatGreen = new THREE.MeshBasicMaterial({ color: 0xc8e6c9 });

      function createWallBlock(w, h, d, x, y, z, mat) {
        const wall = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
        wall.position.set(x, y, z);
        scene.add(wall);

        const box = new THREE.Box3().setFromObject(wall);
        wallBoxes.push(box);
      }

      // Tashqi Devorlar (60x60)
      createWallBlock(60, 8, 0.6, 0, 4, -30, wallMatMain);
      createWallBlock(60, 8, 0.6, 0, 4, 30, wallMatMain);
      createWallBlock(0.6, 8, 60, -30, 4, 0, wallMatMain);
      createWallBlock(0.6, 8, 60, 30, 4, 0, wallMatMain);

      // Ichki Xonalar
      createWallBlock(18, 8, 0.6, -18, 4, -10, wallMatPink);
      createWallBlock(0.6, 8, 16, -9, 4, -18, wallMatPink);

      createWallBlock(18, 8, 0.6, 18, 4, -10, wallMatBlue);
      createWallBlock(0.6, 8, 16, 9, 4, -18, wallMatBlue);

      createWallBlock(22, 8, 0.6, 0, 4, 10, wallMatGreen);

      // REALISTIK YUMSHOQ PINGVIN MODELI
      const playerGroup = new THREE.Group();
      
      const body = new THREE.Mesh(new THREE.SphereGeometry(0.5, 32, 32), new THREE.MeshBasicMaterial({ color: 0x5b6570 }));
      body.scale.set(1, 1.1, 0.95);
      body.position.y = 0.55;
      playerGroup.add(body);

      const belly = new THREE.Mesh(new THREE.SphereGeometry(0.42, 32, 32), new THREE.MeshBasicMaterial({ color: 0xf5f5f5 }));
      belly.scale.set(0.85, 0.95, 0.6);
      belly.position.set(0, 0.52, 0.22);
      playerGroup.add(belly);

      const beak = new THREE.Mesh(new THREE.SphereGeometry(0.1, 16, 16), new THREE.MeshBasicMaterial({ color: 0xffcc00 }));
      beak.scale.set(1.2, 0.7, 1);
      beak.position.set(0, 0.58, 0.46);
      playerGroup.add(beak);

      const eyeMat = new THREE.MeshBasicMaterial({ color: 0x050505 });
      const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.06, 16, 16), eyeMat);
      eyeL.position.set(-0.16, 0.65, 0.42);
      playerGroup.add(eyeL);
      const eyeR = new THREE.Mesh(new THREE.SphereGeometry(0.06, 16, 16), eyeMat);
      eyeR.position.set(0.16, 0.65, 0.42);
      playerGroup.add(eyeR);

      const footMat = new THREE.MeshBasicMaterial({ color: 0xffcc00 });
      const footL = new THREE.Mesh(new THREE.SphereGeometry(0.14, 16, 16), footMat);
      footL.scale.set(1.1, 0.5, 1.3);
      footL.position.set(-0.2, 0.08, 0.15);
      playerGroup.add(footL);

      const footR = new THREE.Mesh(new THREE.SphereGeometry(0.14, 16, 16), footMat);
      footR.scale.set(1.1, 0.5, 1.3);
      footR.position.set(0.2, 0.08, 0.15);
      playerGroup.add(footR);

      playerGroup.position.set(0, 0, 0);
      scene.add(playerGroup);

      // PIANINO
      const pianoGroup = new THREE.Group();
      const pMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
      const pianoBody = new THREE.Mesh(new THREE.BoxGeometry(2.8, 1.3, 1.0), pMat);
      pianoBody.position.y = 0.65;
      pianoGroup.add(pianoBody);
      const keysObj = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.1, 0.3), new THREE.MeshBasicMaterial({ color: 0xffffff }));
      keysObj.position.set(0, 0.7, 0.45);
      pianoGroup.add(keysObj);
      pianoGroup.position.set(-22, 0, -4);
      scene.add(pianoGroup);

      // Sham Ustunlari
      function createPillarWithCandle(x, z) {
        const pillar = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.8, 0.8), new THREE.MeshBasicMaterial({ color: 0xdfd3c3 }));
        pillar.position.set(x, 0.9, z);
        scene.add(pillar);

        const candle = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.4, 8), new THREE.MeshBasicMaterial({ color: 0xfffdf0 }));
        candle.position.set(x, 2.0, z);
        scene.add(candle);

        const flame = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 8), new THREE.MeshBasicMaterial({ color: 0xff8c00 }));
        flame.position.set(x, 2.25, z);
        scene.add(flame);
      }

      createPillarWithCandle(-15, -4);
      createPillarWithCandle(15, -4);
      createPillarWithCandle(-5, 8);
      createPillarWithCandle(5, 8);

      // GALEREYA EKSPONATLARI (20 Ta)
      const galleryItems = [];
      const frameMat = new THREE.MeshBasicMaterial({ color: 0x8b5a2b });

      const itemData = [
        { type: 'photo', url: 'https://picsum.photos/400/500?sig=1', pos: [-6, 3.5, -29.6], size: [2.5, 3.2] },
        { type: 'photo', url: 'https://picsum.photos/400/500?sig=2', pos: [6, 3.5, -29.6], size: [2.5, 3.2] },
        { type: 'photo', url: 'https://picsum.photos/400/500?sig=3', pos: [-20, 3.5, -29.6], size: [2.5, 3.2] },
        { type: 'photo', url: 'https://picsum.photos/400/500?sig=4', pos: [20, 3.5, -29.6], size: [2.5, 3.2] },
        
        { type: 'video', url: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4', pos: [0, 3.5, -29.6], size: [3.8, 2.4] },
        { type: 'video', url: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4', pos: [-18, 3.5, -9.6], size: [3.8, 2.4] },
        { type: 'video', url: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4', pos: [18, 3.5, -9.6], size: [3.8, 2.4] },

        { type: 'photo', url: 'https://picsum.photos/400/500?sig=5', pos: [-29.6, 3.5, -20], size: [2.5, 3.2], rotY: Math.PI/2 },
        { type: 'photo', url: 'https://picsum.photos/400/500?sig=6', pos: [-29.6, 3.5, -15], size: [2.5, 3.2], rotY: Math.PI/2 },
        { type: 'photo', url: 'https://picsum.photos/400/500?sig=7', pos: [-29.6, 3.5, 0], size: [2.5, 3.2], rotY: Math.PI/2 },
        { type: 'photo', url: 'https://picsum.photos/400/500?sig=8', pos: [-29.6, 3.5, 15], size: [2.5, 3.2], rotY: Math.PI/2 },

        { type: 'photo', url: 'https://picsum.photos/400/500?sig=9', pos: [29.6, 3.5, -20], size: [2.5, 3.2], rotY: -Math.PI/2 },
        { type: 'photo', url: 'https://picsum.photos/400/500?sig=10', pos: [29.6, 3.5, -15], size: [2.5, 3.2], rotY: -Math.PI/2 },
        { type: 'photo', url: 'https://picsum.photos/400/500?sig=11', pos: [29.6, 3.5, 0], size: [2.5, 3.2], rotY: -Math.PI/2 },
        { type: 'photo', url: 'https://picsum.photos/400/500?sig=12', pos: [29.6, 3.5, 15], size: [2.5, 3.2], rotY: -Math.PI/2 },

        { type: 'photo', url: 'https://picsum.photos/400/500?sig=13', pos: [-10, 3.5, 29.6], size: [2.5, 3.2], rotY: Math.PI },
        { type: 'photo', url: 'https://picsum.photos/400/500?sig=14', pos: [10, 3.5, 29.6], size: [2.5, 3.2], rotY: Math.PI }
      ];

      itemData.forEach(item => {
        const itemGroup = new THREE.Group();
        const rotY = item.rotY || 0;

        const frame = new THREE.Mesh(new THREE.BoxGeometry(item.size[0] + 0.3, item.size[1] + 0.3, 0.08), frameMat);
        frame.rotation.y = rotY;
        itemGroup.add(frame);

        if (item.type === 'photo') {
          const tex = new THREE.TextureLoader().load(item.url);
          const photo = new THREE.Mesh(new THREE.PlaneGeometry(item.size[0], item.size[1]), new THREE.MeshBasicMaterial({ map: tex }));
          photo.position.set(0, 0, 0.05);
          photo.rotation.y = rotY;
          itemGroup.add(photo);
        } else if (item.type === 'video') {
          const vid = document.createElement('video');
          vid.src = item.url;
          vid.crossOrigin = 'anonymous';
          vid.loop = true;
          vid.muted = false;
          vid.volume = 0.0;
          vid.load();

          const tex = new THREE.VideoTexture(vid);
          const videoMesh = new THREE.Mesh(new THREE.PlaneGeometry(item.size[0], item.size[1]), new THREE.MeshBasicMaterial({ map: tex }));
          videoMesh.position.set(0, 0, 0.05);
          videoMesh.rotation.y = rotY;
          itemGroup.add(videoMesh);

          galleryItems.push({ mesh: itemGroup, video: vid });
        }

        itemGroup.position.set(item.pos[0], item.pos[1], item.pos[2]);
        scene.add(itemGroup);
      });

      // JOYSTICK MANAGEMENT
      const zone = document.getElementById('joystick-zone');
      const knob = document.getElementById('joystick-knob');
      let moveData = { x: 0, y: 0 };
      let isTouching = false;

      zone.addEventListener('touchstart', (e) => { isTouching = true; updateJoystick(e.touches[0]); e.stopPropagation(); });
      window.addEventListener('touchmove', (e) => { if(isTouching) { updateJoystick(e.touches[0]); e.stopPropagation(); } });
      window.addEventListener('touchend', () => {
        isTouching = false;
        knob.style.left = '32px';
        knob.style.top = '32px';
        moveData = { x: 0, y: 0 };
      });

      function updateJoystick(touch) {
        const rect = zone.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;
        let dx = touch.clientX - centerX;
        let dy = touch.clientY - centerY;
        const dist = Math.sqrt(dx*dx + dy*dy);
        const maxRadius = 38;

        if (dist > maxRadius) {
          dx = (dx / dist) * maxRadius;
          dy = (dy / dist) * maxRadius;
        }

        knob.style.left = `${32 + dx}px`;
        knob.style.top = `${32 + dy}px`;

        moveData.x = dx / maxRadius;
        moveData.y = dy / maxRadius;
      }

      function canMoveTo(newX, newZ) {
        const playerRadius = 0.5;
        const playerBox = new THREE.Box3(
          new THREE.Vector3(newX - playerRadius, 0, newZ - playerRadius),
          new THREE.Vector3(newX + playerRadius, 1.2, newZ + playerRadius)
        );

        for (let i = 0; i < wallBoxes.length; i++) {
          if (playerBox.intersectsBox(wallBoxes[i])) {
            return false;
          }
        }
        return true;
      }

      // ANIMATSIYA SIKLI
      let walkTimer = 0;
      function animate() {
        requestAnimationFrame(animate);

        if (Math.abs(moveData.x) > 0.1 || Math.abs(moveData.y) > 0.1) {
          const speed = 0.13;
          
          const camAngle = Math.atan2(
            camera.position.x - playerGroup.position.x,
            camera.position.z - playerGroup.position.z
          );

          const moveAngle = Math.atan2(moveData.x, moveData.y) + camAngle;

          const nextX = playerGroup.position.x + Math.sin(moveAngle) * speed;
          const nextZ = playerGroup.position.z + Math.cos(moveAngle) * speed;

          if (canMoveTo(nextX, playerGroup.position.z)) {
            playerGroup.position.x = nextX;
          }
          if (canMoveTo(playerGroup.position.x, nextZ)) {
            playerGroup.position.z = nextZ;
          }

          playerGroup.rotation.y = moveAngle;

          walkTimer += 0.18;
          playerGroup.rotation.z = Math.sin(walkTimer) * 0.1;
          playerGroup.position.y = Math.abs(Math.sin(walkTimer)) * 0.08;
        } else {
          playerGroup.rotation.z = 0;
          playerGroup.position.y = 0;
        }

        controls.target.set(playerGroup.position.x, playerGroup.position.y + 0.6, playerGroup.position.z);
        controls.update();

        let nearAnyVideo = false;
        galleryItems.forEach(item => {
          const dist = playerGroup.position.distanceTo(item.mesh.position);
          if (dist < 5.0) {
            nearAnyVideo = true;
            if (item.video.paused) {
              item.video.play().catch(e => console.log(e));
            }
            item.video.volume = Math.max(0.0, Math.min(1.0, (5.0 - dist) / 3));
          } else {
            item.video.volume = 0;
            if (!item.video.paused) item.video.pause();
          }
        });

        if (nearAnyVideo) {
          if (!bgMusic.paused) bgMusic.pause();
        } else {
          if (bgMusic.paused) bgMusic.play().catch(e => console.log(e));
        }

        renderer.render(scene, camera);
      }
      animate();
    }
  </script>
</body>
</html>
