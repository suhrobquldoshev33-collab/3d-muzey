<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Muzeycha 3D Galereya & Marry Me</title>
  <style>
    body { margin: 0; overflow: hidden; background: #0e0915; font-family: sans-serif; touch-action: none; }
    #canvas-container { width: 100vw; height: 100vh; display: none; }
    
    #ui {
      position: absolute; top: 15px; width: 100%; text-align: center;
      color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.8); pointer-events: none; z-index: 10; display: none;
    }
    h1 { font-size: 18px; margin: 0; color: #ffdfa9; }
    p { font-size: 11px; opacity: 0.9; margin-top: 3px; }

    #upload-container {
      position: absolute; top: 15px; right: 15px; z-index: 20; display: none;
    }
    .upload-btn {
      background: #ffdfa9; color: #120c1f; font-weight: bold; padding: 8px 14px;
      border-radius: 8px; border: none; font-size: 12px; cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    #media-input { display: none; }

    #joystick-zone {
      position: absolute; bottom: 30px; left: 25px; width: 110px; height: 110px;
      background: rgba(255, 255, 255, 0.2); border: 2px solid rgba(255, 255, 255, 0.4);
      border-radius: 50%; touch-action: none; z-index: 10; display: none;
    }
    #joystick-knob {
      position: absolute; top: 32px; left: 32px; width: 45px; height: 45px;
      background: #ffdfa9; border-radius: 50%; box-shadow: 0 0 10px rgba(0,0,0,0.5); pointer-events: none;
    }

    #password-screen {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      background: #120c1f; display: flex; flex-direction: column;
      justify-content: center; align-items: center; z-index: 100; color: white;
    }
    #password-screen h2 { margin-bottom: 15px; color: #ffdfa9; font-size: 20px; }
    #password-input {
      padding: 12px 20px; font-size: 16px; border-radius: 8px; border: 2px solid #ffdfa9;
      background: #221636; color: white; text-align: center; outline: none; margin-bottom: 12px;
    }
    #submit-btn {
      padding: 10px 25px; font-size: 16px; border: none; border-radius: 8px;
      background: #ffdfa9; color: #120c1f; font-weight: bold; cursor: pointer;
    }
    #error-msg { color: #ff4d4d; margin-top: 10px; font-size: 13px; font-weight: bold; display: none; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

  <div id="password-screen">
    <h2>🏛 Muzeycha 3D Galereyasi</h2>
    <input type="password" id="password-input" placeholder="Parolni kiriting..." autofocus>
    <button id="submit-btn" onclick="checkPassword()">KIRISH</button>
    <div id="error-msg">Noto'g'ri parol! Qayta urining.</div>
  </div>

  <div id="ui">
    <h1>🏛 3D Galereya & Marry Me Zone</h1>
    <p>Galereyadan fayl yuklang | Marry Me xonasiga tashrif buyuring!</p>
  </div>

  <div id="upload-container">
    <button class="upload-btn" onclick="document.getElementById('media-input').click()">
      📁 Galereyadan tanlash
    </button>
    <input type="file" id="media-input" accept="image/*,video/*" multiple onchange="handleFileSelect(event)">
  </div>
  
  <div id="joystick-zone">
    <div id="joystick-knob"></div>
  </div>

  <div id="canvas-container"></div>

  <audio id="bg-music" loop src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=relaxing-piano-112221.mp3"></audio>

  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      Telegram.WebApp.ready();
      Telegram.WebApp.expand();
    }

    const correctPassword = "muzey2026";
    let bgMusic = document.getElementById("bg-music");
    let controls, scene;
    let gallerySlots = [];
    let currentSlotIndex = 0;
    let butterflies = [];

    function checkPassword() {
      const input = document.getElementById("password-input").value;
      if (input === correctPassword) {
        document.getElementById("password-screen").style.display = "none";
        document.getElementById("canvas-container").style.display = "block";
        document.getElementById("ui").style.display = "block";
        document.getElementById("upload-container").style.display = "block";
        document.getElementById("joystick-zone").style.display = "block";
        
        bgMusic.play().catch(e => console.log(e));
        init3D();
      } else {
        document.getElementById("error-msg").style.display = "block";
      }
    }

    function handleFileSelect(event) {
      const files = event.target.files;
      if (!files || files.length === 0) return;

      for (let i = 0; i < files.length; i++) {
        if (currentSlotIndex >= gallerySlots.length) {
          alert("Muzeydagi barcha ramkalar to'ldi!");
          break;
        }

        const file = files[i];
        const fileURL = URL.createObjectURL(file);
        const slot = gallerySlots[currentSlotIndex];

        if (file.type.startsWith('image/')) {
          const texture = new THREE.TextureLoader().load(fileURL);
          slot.mesh.material = new THREE.MeshBasicMaterial({ map: texture });
        } else if (file.type.startsWith('video/')) {
          const vid = document.createElement('video');
          vid.src = fileURL;
          vid.crossOrigin = 'anonymous';
          vid.loop = true;
          vid.muted = false;
          vid.volume = 0.0;
          vid.play();

          const texture = new THREE.VideoTexture(vid);
          slot.mesh.material = new THREE.MeshBasicMaterial({ map: texture });
          slot.video = vid;
        }

        currentSlotIndex++;
      }
    }

    function createTextSprite(text, fontSize = 70, color = "#ff4081") {
      const canvas = document.createElement('canvas');
      canvas.width = 512; canvas.height = 256;
      const ctx = canvas.getContext('2d');
      ctx.font = `Bold ${fontSize}px sans-serif`;
      ctx.fillStyle = color;
      ctx.textAlign = "center";
      ctx.shadowColor = "rgba(255, 64, 129, 0.8)";
      ctx.shadowBlur = 15;
      ctx.fillText(text, 256, 140);
      
      const texture = new THREE.CanvasTexture(canvas);
      const spriteMat = new THREE.SpriteMaterial({ map: texture, transparent: true });
      const sprite = new THREE.Sprite(spriteMat);
      sprite.scale.set(4, 2, 1);
      return sprite;
    }

    function init3D() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0xf2e9e1);

      const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 5, 8);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      document.getElementById('canvas-container').appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.maxPolarAngle = Math.PI / 2 - 0.05;

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.95);
      scene.add(ambientLight);

      // POL & SHIFT (Balandligi 9m, Devorlar Shiftgacha yetgan)
      const wallMat = new THREE.MeshBasicMaterial({ color: 0xfff8f0 });
      const floorMat = new THREE.MeshBasicMaterial({ color: 0xe8dcd0 });
      const ceilingMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

      const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), floorMat);
      floor.rotation.x = -Math.PI / 2;
      scene.add(floor);

      const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), ceilingMat);
      ceiling.position.y = 9;
      ceiling.rotation.x = Math.PI / 2;
      scene.add(ceiling);

      const wallBoxes = [];
      function createWallBlock(w, h, d, x, y, z, mat = wallMat) {
        const wall = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
        wall.position.set(x, y, z);
        scene.add(wall);
        wallBoxes.push(new THREE.Box3().setFromObject(wall));
      }

      // TASHQI DEVORLAR (Shiftgacha: Balandligi 9m)
      createWallBlock(60, 9, 0.6, 0, 4.5, -30);
      createWallBlock(60, 9, 0.6, 0, 4.5, 30);
      createWallBlock(0.6, 9, 60, -30, 4.5, 0);
      createWallBlock(0.6, 9, 60, 30, 4.5, 0);

      // MARRY ME XONASI BO'LINMASI (O'ng burchakda)
      createWallBlock(20, 9, 0.6, 20, 4.5, 10);
      createWallBlock(0.6, 9, 20, 10, 4.5, 20);

      // SHIFTDA CHIROYLI QANDILLAR (Chandeliers)
      function createChandelier(x, z) {
        const cGroup = new THREE.Group();
        const base = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.8, 1.2, 16), new THREE.MeshBasicMaterial({ color: 0xd4af37 }));
        cGroup.add(base);
        for(let i=0; i<6; i++) {
          const crystal = new THREE.Mesh(new THREE.SphereGeometry(0.15, 8, 8), new THREE.MeshBasicMaterial({ color: 0xffffff }));
          const angle = (i/6)*Math.PI*2;
          crystal.position.set(Math.sin(angle)*0.7, -0.8, Math.cos(angle)*0.7);
          cGroup.add(crystal);
        }
        cGroup.position.set(x, 8.2, z);
        scene.add(cGroup);
      }
      createChandelier(0, -15);
      createChandelier(-15, 0);
      createChandelier(20, 20); // Marry Me xonasida

      // QIZIL GILAMCHA (Red Carpet - Marry Me Xonasiga Elituvchi)
      const carpetGeo = new THREE.PlaneGeometry(3.5, 22);
      const carpetMat = new THREE.MeshBasicMaterial({ color: 0xc62828 });
      const carpet = new THREE.Mesh(carpetGeo, carpetMat);
      carpet.rotation.x = -Math.PI / 2;
      carpet.position.set(20, 0.02, 19);
      scene.add(carpet);

      // UCHIB YURUVCHI RANG-BARANG KAPALAKLAR
      const bColors = [0xff4081, 0x00e5ff, 0x76ff03, 0xffea00, 0xe040fb];
      for(let i=0; i<18; i++) {
        const bGeo = new THREE.BufferGeometry();
        const bMat = new THREE.MeshBasicMaterial({ color: bColors[i % bColors.length], side: THREE.DoubleSide });
        const butterfly = new THREE.Mesh(new THREE.PlaneGeometry(0.3, 0.3), bMat);
        butterfly.position.set(15 + Math.random()*10, 1 + Math.random()*3, 10 + Math.random()*15);
        scene.add(butterfly);
        butterflies.push({ mesh: butterfly, speed: 0.02 + Math.random()*0.02, offset: Math.random()*100 });
      }

      // MARRY ME ZONASI: KUYOV VA KELIN
      const marryGroup = new THREE.Group();
      marryGroup.position.set(20, 0, 26);

      // S + Z RO'PARASIDAGI CHIROYLI YOZUV
      const szText = createTextSprite("S + Z", 90, "#ff2a6d");
      szText.position.set(0, 4.2, -3);
      marryGroup.add(szText);

      const marryText = createTextSprite("WILL YOU MARRY ME? 💍", 50, "#d4af37");
      marryText.position.set(0, 3.2, -3);
      marryGroup.add(marryText);

      // KUYOV (Tiz cho'kib qo'lini so'rayotgan)
      const groomGroup = new THREE.Group();
      const gBody = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.35, 0.9), new THREE.MeshBasicMaterial({ color: 0x111111 })); // Kostyum
      gBody.position.y = 0.45;
      groomGroup.add(gBody);
      const gHead = new THREE.Mesh(new THREE.SphereGeometry(0.2, 16, 16), new THREE.MeshBasicMaterial({ color: 0xffdbac }));
      gHead.position.y = 1.0;
      groomGroup.add(gHead);
      // Qo'lida uzuk tutgan qo'l
      const gArm = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 0.4), new THREE.MeshBasicMaterial({ color: 0x111111 }));
      gArm.position.set(0, 0.7, 0.3);
      groomGroup.add(gArm);
      groomGroup.position.set(-0.6, 0, 0);
      marryGroup.add(groomGroup);

      // KELIN (Oq ko'ylakda va Emojili Reaksiyasi)
      const brideGroup = new THREE.Group();
      const bDress = new THREE.Mesh(new THREE.ConeGeometry(0.65, 1.2, 16), new THREE.MeshBasicMaterial({ color: 0xffffff })); // Oq ko'ylak
      bDress.position.y = 0.6;
      brideGroup.add(bDress);
      const bHead = new THREE.Mesh(new THREE.SphereGeometry(0.2, 16, 16), new THREE.MeshBasicMaterial({ color: 0xffdbac }));
      bHead.position.y = 1.3;
      brideGroup.add(bHead);
      brideGroup.position.set(0.6, 0, 0);
      marryGroup.add(brideGroup);

      // KELIN REAKSIYASI EMOJILARI (♥️🔥🥰💖💞)
      const emojiSprite = createTextSprite("♥️ 🔥 🥰 💖 💞", 55, "#ff1744");
      emojiSprite.position.set(0.6, 2.1, 0);
      marryGroup.add(emojiSprite);

      scene.add(marryGroup);

      // PINGVIN MODELI
      const playerGroup = new THREE.Group();
      const body = new THREE.Mesh(new THREE.SphereGeometry(0.5, 32, 32), new THREE.MeshBasicMaterial({ color: 0x5b6570 }));
      body.scale.set(1, 1.1, 0.95); body.position.y = 0.55; playerGroup.add(body);
      const belly = new THREE.Mesh(new THREE.SphereGeometry(0.42, 32, 32), new THREE.MeshBasicMaterial({ color: 0xf5f5f5 }));
      belly.scale.set(0.85, 0.95, 0.6); belly.position.set(0, 0.52, 0.22); playerGroup.add(belly);
      const beak = new THREE.Mesh(new THREE.SphereGeometry(0.1, 16, 16), new THREE.MeshBasicMaterial({ color: 0xffcc00 }));
      beak.scale.set(1.2, 0.7, 1); beak.position.set(0, 0.58, 0.46); playerGroup.add(beak);
      const eyeMat = new THREE.MeshBasicMaterial({ color: 0x050505 });
      const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.06, 16, 16), eyeMat); eyeL.position.set(-0.16, 0.65, 0.42); playerGroup.add(eyeL);
      const eyeR = new THREE.Mesh(new THREE.SphereGeometry(0.06, 16, 16), eyeMat); eyeR.position.set(0.16, 0.65, 0.42); playerGroup.add(eyeR);
      playerGroup.position.set(0, 0, 0);
      scene.add(playerGroup);

      // RAMKALAR (Galereya Slots + Marry Me Zonasidagi Maxsus Ramka)
      const frameMat = new THREE.MeshBasicMaterial({ color: 0x8b5a2b });
      const slotPositions = [
        { pos: [20, 3.5, 29.4], size: [3.8, 2.4], rotY: Math.PI }, // MARRY ME ZONASIDAGI RAMKA
        { pos: [0, 3.5, -29.6], size: [3.8, 2.4] },
        { pos: [-6, 3.5, -29.6], size: [2.5, 3.2] },
        { pos: [6, 3.5, -29.6], size: [2.5, 3.2] },
        { pos: [-20, 3.5, -29.6], size: [2.5, 3.2] },
        { pos: [20, 3.5, -29.6], size: [2.5, 3.2] },
        { pos: [-29.6, 3.5, -20], size: [2.5, 3.2], rotY: Math.PI/2 },
        { pos: [-29.6, 3.5, -15], size: [2.5, 3.2], rotY: Math.PI/2 }
      ];

      slotPositions.forEach(slot => {
        const itemGroup = new THREE.Group();
        const rotY = slot.rotY || 0;

        const frame = new THREE.Mesh(new THREE.BoxGeometry(slot.size[0] + 0.3, slot.size[1] + 0.3, 0.08), frameMat);
        frame.rotation.y = rotY;
        itemGroup.add(frame);

        const placeholderMat = new THREE.MeshBasicMaterial({ color: 0xd1c7bd });
        const mediaMesh = new THREE.Mesh(new THREE.PlaneGeometry(slot.size[0], slot.size[1]), placeholderMat);
        mediaMesh.position.set(0, 0, 0.05);
        mediaMesh.rotation.y = rotY;
        itemGroup.add(mediaMesh);

        itemGroup.position.set(slot.pos[0], slot.pos[1], slot.pos[2]);
        scene.add(itemGroup);

        gallerySlots.push({ mesh: mediaMesh, group: itemGroup, video: null });
      });

      // JOYSTICK
      const zone = document.getElementById('joystick-zone');
      const knob = document.getElementById('joystick-knob');
      let moveData = { x: 0, y: 0 };
      let isTouching = false;

      zone.addEventListener('touchstart', (e) => { isTouching = true; updateJoystick(e.touches[0]); e.stopPropagation(); });
      window.addEventListener('touchmove', (e) => { if(isTouching) { updateJoystick(e.touches[0]); e.stopPropagation(); } });
      window.addEventListener('touchend', () => {
        isTouching = false;
        knob.style.left = '32px'; knob.style.top = '32px';
        moveData = { x: 0, y: 0 };
      });

      function updateJoystick(touch) {
        const rect = zone.getBoundingClientRect();
        let dx = touch.clientX - (rect.left + rect.width / 2);
        let dy = touch.clientY - (rect.top + rect.height / 2);
        const dist = Math.sqrt(dx*dx + dy*dy);
        const maxRadius = 38;

        if (dist > maxRadius) { dx = (dx / dist) * maxRadius; dy = (dy / dist) * maxRadius; }
        knob.style.left = `${32 + dx}px`; knob.style.top = `${32 + dy}px`;
        moveData.x = dx / maxRadius; moveData.y = dy / maxRadius;
      }

      function canMoveTo(newX, newZ) {
        const playerBox = new THREE.Box3(
          new THREE.Vector3(newX - 0.5, 0, newZ - 0.5),
          new THREE.Vector3(newX + 0.5, 1.2, newZ + 0.5)
        );
        for (let i = 0; i < wallBoxes.length; i++) {
          if (playerBox.intersectsBox(wallBoxes[i])) return false;
        }
        return true;
      }

      let walkTimer = 0;
      function animate() {
        requestAnimationFrame(animate);

        if (Math.abs(moveData.x) > 0.1 || Math.abs(moveData.y) > 0.1) {
          const speed = 0.13;
          const camAngle = Math.atan2(camera.position.x - playerGroup.position.x, camera.position.z - playerGroup.position.z);
          const moveAngle = Math.atan2(moveData.x, moveData.y) + camAngle;

          const nextX = playerGroup.position.x + Math.sin(moveAngle) * speed;
          const nextZ = playerGroup.position.z + Math.cos(moveAngle) * speed;

          if (canMoveTo(nextX, playerGroup.position.z)) playerGroup.position.x = nextX;
          if (canMoveTo(playerGroup.position.x, nextZ)) playerGroup.position.z = nextZ;

          playerGroup.rotation.y = moveAngle;
          walkTimer += 0.18;
          playerGroup.rotation.z = Math.sin(walkTimer) * 0.1;
          playerGroup.position.y = Math.abs(Math.sin(walkTimer)) * 0.08;
        } else {
          playerGroup.rotation.z = 0; playerGroup.position.y = 0;
        }

        // Kapalaklar Parvozi
        butterflies.forEach(b => {
          b.offset += 0.03;
          b.mesh.position.y += Math.sin(b.offset) * 0.01;
          b.mesh.position.x += Math.cos(b.offset) * 0.01;
        });

        controls.target.set(playerGroup.position.x, playerGroup.position.y + 0.6, playerGroup.position.z);
        controls.update();

        let nearAnyVideo = false;
        gallerySlots.forEach(slot => {
          if (slot.video) {
            const dist = playerGroup.position.distanceTo(slot.group.position);
            if (dist < 5.0) {
              nearAnyVideo = true;
              if (slot.video.paused) slot.video.play().catch(e => console.log(e));
              slot.video.volume = Math.max(0.0, Math.min(1.0, (5.0 - dist) / 3));
            } else {
              slot.video.volume = 0;
              if (!slot.video.paused) slot.video.pause();
            }
          }
        });

        if (nearAnyVideo) { if (!bgMusic.paused) bgMusic.pause(); }
        else { if (bgMusic.paused) bgMusic.play().catch(e => console.log(e)); }

        renderer.render(scene, camera);
      }
      animate();
    }
  </script>
</body>
</html>
