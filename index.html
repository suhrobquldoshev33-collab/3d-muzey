<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>5D Shinam Muzey & Marry Me</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 0; overflow: hidden; background: #05030a; font-family: sans-serif; touch-action: none; color: white; }
    #canvas-container { width: 100vw; height: 100vh; display: none; position: absolute; top: 0; left: 0; z-index: 1; }
    
    #ui {
      position: absolute; top: 15px; width: 100%; text-align: center;
      color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,0.9); pointer-events: none; z-index: 10; display: none;
    }
    h1 { font-size: 18px; margin: 0; color: #ffdfa9; }
    p { font-size: 11px; opacity: 0.9; margin-top: 4px; }

    .screen-panel {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      background: #0d0814; display: flex; flex-direction: column;
      justify-content: center; align-items: center; z-index: 1000;
    }
    .panel-card {
      background: #1c1328; padding: 25px 20px; border-radius: 16px; border: 2px solid #ffdfa9;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8); text-align: center; width: 85%; max-width: 320px;
    }
    .panel-card h2 { margin-top: 0; color: #ffdfa9; font-size: 20px; margin-bottom: 15px; }
    
    .menu-btn {
      width: 100%; padding: 12px 10px; margin: 8px 0; font-size: 14px; font-weight: bold;
      border: none; border-radius: 10px; background: linear-gradient(135deg, #ffdfa9, #f3a683);
      color: #120c1f; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .menu-btn:active { transform: scale(0.96); }

    #joystick-zone {
      position: absolute; bottom: 35px; left: 25px; width: 110px; height: 110px;
      background: rgba(255, 255, 255, 0.15); border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%; touch-action: none; z-index: 10; display: none;
    }
    #joystick-knob {
      position: absolute; top: 32px; left: 32px; width: 45px; height: 45px;
      background: #ffdfa9; border-radius: 50%; box-shadow: 0 0 12px rgba(255,223,169,0.8); pointer-events: none;
    }

    #back-to-menu-btn {
      position: absolute; top: 15px; left: 15px; z-index: 99; display: none;
      background: rgba(0,0,0,0.7); color: #ffdfa9; border: 1px solid #ffdfa9;
      padding: 8px 14px; border-radius: 8px; font-size: 12px; font-weight: bold; cursor: pointer;
    }

    #media-input { display: none; }
  </style>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

  <div id="dashboard-screen" class="screen-panel">
    <div class="panel-card">
      <h2>🏛 Muzey Boshqaruvi</h2>
      <button class="menu-btn" id="b-enter">🏛 Muzeyga kirish</button>
      <button class="menu-btn" id="b-edit">✏️ Muzeyni tahrirlash</button>
      <button class="menu-btn" id="b-share">🔗 Muzeyni ulashish</button>
      <button class="menu-btn" id="b-gallery">📁 Galereyadan tanlash</button>
    </div>
  </div>

  <button id="back-to-menu-btn">↩ Menyu</button>

  <div id="ui">
    <h1>🏛 5D Shinam Muzey & Marry Me</h1>
    <p>Eksponat yoniga borsa krupniy rejim ishlaydi</p>
  </div>

  <input type="file" id="media-input" accept="image/*,video/*" multiple>
  <div id="joystick-zone"><div id="joystick-knob"></div></div>
  <div id="canvas-container"></div>

  <audio id="bg-music" loop src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c823023e.mp3?filename=soft-piano-10781.mp3"></audio>

  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      Telegram.WebApp.ready();
      Telegram.WebApp.expand();
    }

    let bgMusic = document.getElementById("bg-music");
    let controls, scene, camera, renderer;
    let gallerySlots = [];
    let currentSlotIndex = 0;
    let is3dInitialized = false;
    let playerGroup;

    document.getElementById("b-enter").addEventListener("click", enterMuseum);
    document.getElementById("b-edit").addEventListener("click", openGallery);
    document.getElementById("b-gallery").addEventListener("click", openGallery);
    document.getElementById("b-share").addEventListener("click", shareMuseum);
    document.getElementById("back-to-menu-btn").addEventListener("click", showDashboard);
    document.getElementById("media-input").addEventListener("change", handleFileSelect);

    function showDashboard() {
      document.getElementById("canvas-container").style.display = "none";
      document.getElementById("ui").style.display = "none";
      document.getElementById("joystick-zone").style.display = "none";
      document.getElementById("back-to-menu-btn").style.display = "none";
      document.getElementById("dashboard-screen").style.display = "flex";
      if (bgMusic && !bgMusic.paused) bgMusic.pause();
    }

    function openGallery() {
      document.getElementById('media-input').click();
    }

    function enterMuseum() {
      document.getElementById("dashboard-screen").style.display = "none";
      document.getElementById("canvas-container").style.display = "block";
      document.getElementById("ui").style.display = "block";
      document.getElementById("joystick-zone").style.display = "block";
      document.getElementById("back-to-menu-btn").style.display = "block";
      
      if(bgMusic) {
        bgMusic.volume = 0.4;
        bgMusic.play().catch(e => console.log(e));
      }

      if (!is3dInitialized) {
        init3D();
        is3dInitialized = true;
      }
    }

    function shareMuseum() {
      const currentUrl = window.location.href;
      const shareText = "Mening shinam 3D muzeyimga marhamat! 🏛✨";
      
      if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.openTelegramLink) {
        const telegramShareUrl = `https://t.me/share/url?url=${encodeURIComponent(currentUrl)}&text=${encodeURIComponent(shareText)}`;
        window.Telegram.WebApp.openTelegramLink(telegramShareUrl);
      } else {
        if (navigator.clipboard) {
          navigator.clipboard.writeText(currentUrl).then(() => {
            alert("Muzey havolasi nusxalandi:\n" + currentUrl);
          });
        } else {
          alert("Muzey havolasi:\n" + currentUrl);
        }
      }
    }

    function handleFileSelect(event) {
      const files = event.target.files;
      if (!files || files.length === 0) return;

      if (!is3dInitialized) {
        init3D();
        is3dInitialized = true;
      }

      for (let i = 0; i < files.length; i++) {
        if (currentSlotIndex >= gallerySlots.length) {
          alert("Muzeydagi barcha ramkalar to'ldi!");
          break;
        }

        const file = files[i];
        const fileURL = URL.createObjectURL(file);
        const slot = gallerySlots[currentSlotIndex];

        if (slot.video) {
          slot.video.pause();
          slot.video = null;
        }

        if (file.type.startsWith('image/')) {
          const loader = new THREE.TextureLoader();
          loader.load(fileURL, (tex) => {
            tex.generateMipmaps = true;
            tex.minFilter = THREE.LinearMipmapLinearFilter;
            slot.mesh.material = new THREE.MeshBasicMaterial({ map: tex });
          });
        } else if (file.type.startsWith('video/')) {
          const vid = document.createElement('video');
          vid.src = fileURL;
          vid.crossOrigin = 'anonymous';
          vid.loop = true;
          vid.muted = false;
          vid.volume = 0.0;
          vid.play();

          const tex = new THREE.VideoTexture(vid);
          tex.minFilter = THREE.LinearFilter;
          slot.mesh.material = new THREE.MeshBasicMaterial({ map: tex });
          slot.video = vid;
        }

        currentSlotIndex++;
      }

      enterMuseum();
    }

    function createTextSprite(text, fontSize = 75, color = "#ff4081") {
      const canvas = document.createElement('canvas');
      canvas.width = 1024; canvas.height = 512;
      const ctx = canvas.getContext('2d');
      ctx.font = `Bold ${fontSize}px sans-serif`;
      ctx.fillStyle = color;
      ctx.textAlign = "center";
      ctx.shadowColor = "rgba(255, 64, 129, 0.9)";
      ctx.shadowBlur = 20;
      ctx.fillText(text, 512, 256);
      
      const texture = new THREE.CanvasTexture(canvas);
      const spriteMat = new THREE.SpriteMaterial({ map: texture, transparent: true });
      const sprite = new THREE.Sprite(spriteMat);
      sprite.scale.set(6, 3, 1);
      return sprite;
    }

    function init3D() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x1a1128);

      camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 3.5, 7.5);

      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      
      const container = document.getElementById('canvas-container');
      container.innerHTML = '';
      container.appendChild(renderer.domElement);

      if (typeof THREE.OrbitControls !== 'undefined') {
        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.maxPolarAngle = Math.PI / 2 - 0.05;
        controls.minDistance = 1.5;
        controls.maxDistance = 14.0;
      }

      scene.add(new THREE.AmbientLight(0xffffff, 0.9));
      const dirLight = new THREE.DirectionalLight(0xfffaed, 0.7);
      dirLight.position.set(5, 12, 5);
      scene.add(dirLight);

      const wallMat = new THREE.MeshBasicMaterial({ color: 0x31244a });
      const accentWallMat = new THREE.MeshBasicMaterial({ color: 0x543242 });
      const floorMat = new THREE.MeshBasicMaterial({ color: 0x422d1a });
      const ceilingMat = new THREE.MeshBasicMaterial({ color: 0x1d142b });

      const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), floorMat);
      floor.rotation.x = -Math.PI / 2;
      scene.add(floor);

      const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), ceilingMat);
      ceiling.position.y = 3.5;
      ceiling.rotation.x = Math.PI / 2;
      scene.add(ceiling);

      for(let x = -10; x <= 10; x += 10) {
        for(let z = -10; z <= 10; z += 10) {
          const lampBase = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.5, 0.3, 16), new THREE.MeshBasicMaterial({color: 0xd4af37}));
          lampBase.position.set(x, 3.35, z);
          scene.add(lampBase);
          const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.2, 16, 16), new THREE.MeshBasicMaterial({color: 0xffffff}));
          bulb.position.set(x, 3.15, z);
          scene.add(bulb);
        }
      }

      function createWall(w, h, d, x, y, z, mat = wallMat) {
        const wall = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
        wall.position.set(x, y, z);
        scene.add(wall);
      }

      createWall(40, 3.5, 0.5, 0, 1.75, -20);
      createWall(40, 3.5, 0.5, 0, 1.75, 20, accentWallMat);
      createWall(0.5, 3.5, 40, -20, 1.75, 0);
      createWall(0.5, 3.5, 40, 20, 1.75, 0);

      function createDoorway(x, z, rotY = 0) {
        const doorGroup = new THREE.Group();
        const frameMat = new THREE.MeshBasicMaterial({ color: 0xd4af37 });
        
        const leftPost = new THREE.Mesh(new THREE.BoxGeometry(0.3, 3.0, 0.6), frameMat);
        leftPost.position.set(-1.6, 1.5, 0);
        doorGroup.add(leftPost);

        const rightPost = new THREE.Mesh(new THREE.BoxGeometry(0.3, 3.0, 0.6), frameMat);
        rightPost.position.set(1.6, 1.5, 0);
        doorGroup.add(rightPost);

        const topArch = new THREE.Mesh(new THREE.BoxGeometry(3.5, 0.3, 0.6), frameMat);
        topArch.position.set(0, 3.0, 0);
        doorGroup.add(topArch);

        doorGroup.position.set(x, 0, z);
        doorGroup.rotation.y = rotY;
        scene.add(doorGroup);
      }
      createDoorway(0, -20);
      createDoorway(-20, 0, Math.PI / 2);
      createDoorway(20, 0, -Math.PI / 2);

      function createStatue(x, z) {
        const statueGroup = new THREE.Group();
        const pedestal = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.2, 0.8), new THREE.MeshBasicMaterial({color: 0x554433}));
        pedestal.position.y = 0.6;
        statueGroup.add(pedestal);
        const sculpture = new THREE.Mesh(new THREE.ConeGeometry(0.4, 1.2, 16), new THREE.MeshBasicMaterial({color: 0xd4af37}));
        sculpture.position.y = 1.8;
        statueGroup.add(sculpture);
        statueGroup.position.set(x, 0, z);
        scene.add(statueGroup);
      }
      createStatue(-12, -12);
      createStatue(12, -12);
      createStatue(-12, 12);
      createStatue(12, 12);

      const carpet = new THREE.Mesh(new THREE.PlaneGeometry(3.0, 14), new THREE.MeshBasicMaterial({ color: 0x990000 }));
      carpet.rotation.x = -Math.PI / 2;
      carpet.position.set(0, 0.01, 12);
      scene.add(carpet);

      const marryGroup = new THREE.Group();
      marryGroup.position.set(0, 0, 19.2);
      marryGroup.add(createTextSprite("S + Z", 120, "#ff2a6d")).position.set(0, 2.5, 0);
      marryGroup.add(createTextSprite("WILL YOU MARRY ME? 💍", 60, "#d4af37")).position.set(0, 1.7, 0);
      scene.add(marryGroup);

      // Gul tutgan ayiqcha (Personaj)
      playerGroup = new THREE.Group();
      const bearMat = new THREE.MeshBasicMaterial({ color: 0xa0522d });
      const bellyMat = new THREE.MeshBasicMaterial({ color: 0xffdeb9 });
      
      const body = new THREE.Mesh(new THREE.SphereGeometry(0.65, 32, 32), bearMat);
      body.position.y = 0.65;
      playerGroup.add(body);

      const belly = new THREE.Mesh(new THREE.SphereGeometry(0.4, 32, 32), bellyMat);
      belly.position.set(0, 0.6, 0.35);
      playerGroup.add(belly);

      const head = new THREE.Mesh(new THREE.SphereGeometry(0.48, 32, 32), bearMat);
      head.position.y = 1.4;
      playerGroup.add(head);

      const earLeft = new THREE.Mesh(new THREE.SphereGeometry(0.18, 16, 16), bearMat);
      earLeft.position.set(-0.35, 1.8, 0);
      playerGroup.add(earLeft);

      const earRight = new THREE.Mesh(new THREE.SphereGeometry(0.18, 16, 16), bearMat);
      earRight.position.set(0.35, 1.8, 0);
      playerGroup.add(earRight);

      const flowerGroup = new THREE.Group();
      const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.8), new THREE.MeshBasicMaterial({ color: 0x27ae60 }));
      stem.position.set(0.5, 0.8, 0.4);
      stem.rotation.z = -0.3;
      flowerGroup.add(stem);
      const flowerHead = new THREE.Mesh(new THREE.SphereGeometry(0.15, 16, 16), new THREE.MeshBasicMaterial({ color: 0xe74c3c }));
      flowerHead.position.set(0.62, 1.15, 0.35);
      flowerGroup.add(flowerHead);
      playerGroup.add(flowerGroup);

      scene.add(playerGroup);

      const slotPositions = [
        { pos: [0, 2.0, -19.7], size: [4.0, 2.5] },
        { pos: [-10, 2.0, -19.7], size: [3.0, 3.0] },
        { pos: [10, 2.0, -19.7], size: [3.0, 3.0] },
        { pos: [-19.7, 2.0, 0], size: [3.5, 2.5], rotY: Math.PI / 2 },
        { pos: [19.7, 2.0, 0], size: [3.5, 2.5], rotY: -Math.PI / 2 }
      ];

      slotPositions.forEach(slot => {
        const itemGroup = new THREE.Group();
        const mediaMesh = new THREE.Mesh(new THREE.PlaneGeometry(slot.size[0], slot.size[1]), new THREE.MeshBasicMaterial({ color: 0xd1c7bd }));
        mediaMesh.position.set(0, 0, 0.05);
        if(slot.rotY) mediaMesh.rotation.y = slot.rotY;
        itemGroup.add(mediaMesh);
        itemGroup.position.set(slot.pos[0], slot.pos[1], slot.pos[2]);
        scene.add(itemGroup);
        gallerySlots.push({ mesh: mediaMesh, group: itemGroup, video: null, worldPos: new THREE.Vector3(slot.pos[0], slot.pos[1], slot.pos[2]) });
      });

      const zone = document.getElementById('joystick-zone');
      const knob = document.getElementById('joystick-knob');
      let moveData = { x: 0, y: 0 }, isTouching = false;

      zone.addEventListener('touchstart', (e) => { isTouching = true; updateJoy(e.touches[0]); e.stopPropagation(); });
      window.addEventListener('touchmove', (e) => { if(isTouching) { updateJoy(e.touches[0]); e.stopPropagation(); } });
      window.addEventListener('touchend', () => { isTouching = false; knob.style.left = '32px'; knob.style.top = '32px'; moveData = { x: 0, y: 0 }; });

      function updateJoy(touch) {
        const rect = zone.getBoundingClientRect();
        let dx = touch.clientX - (rect.left + 55), dy = touch.clientY - (rect.top + 55);
        const dist = Math.sqrt(dx*dx + dy*dy), maxR = 38;
        if (dist > maxR) { dx = (dx/dist)*maxR; dy = (dy/dist)*maxR; }
        knob.style.left = `${32 + dx}px`; knob.style.top = `${32 + dy}px`;
        moveData.x = dx / maxR; moveData.y = dy / maxR;
      }

      let activeTargetPos = null;

      function animate() {
        requestAnimationFrame(animate);
        if (Math.abs(moveData.x) > 0.08 || Math.abs(moveData.y) > 0.08) {
          const speed = 0.08;
          const camAngle = Math.atan2(camera.position.x - playerGroup.position.x, camera.position.z - playerGroup.position.z);
          const moveAngle = Math.atan2(moveData.x, moveData.y) + camAngle;
          playerGroup.position.x += Math.sin(moveAngle) * speed;
          playerGroup.position.z += Math.cos(moveAngle) * speed;
          playerGroup.rotation.y = moveAngle;
        }

        let nearestSlot = null;
        let minDistance = 999;

        gallerySlots.forEach(slot => {
          const dist = playerGroup.position.distanceTo(slot.worldPos);
          if (dist < minDistance) {
            minDistance = dist;
            nearestSlot = slot;
          }
        });

        let nearMedia = false;
        if (nearestSlot && minDistance < 3.8) {
          nearMedia = true;
          if (nearestSlot.video) {
            nearestSlot.video.volume = 1.0;
          }
          // Kamera krupniy (yaqin rejim) eksponat va ayiqchani ko'rsatadi
          const targetCamX = nearestSlot.worldPos.x + (nearestSlot.worldPos.z === -19.7 ? 0 : (nearestSlot.worldPos.x < 0 ? 2.5 : -2.5));
          const targetCamZ = nearestSlot.worldPos.z + (nearestSlot.worldPos.z === -19.7 ? 2.5 : 0);
          
          camera.position.x += (targetCamX - camera.position.x) * 0.05;
          camera.position.z += (targetCamZ - camera.position.z) * 0.05;
          camera.position.y += (2.2 - camera.position.y) * 0.05;

          if (controls) {
            controls.target.set(playerGroup.position.x, playerGroup.position.y + 0.6, playerGroup.position.z);
          }
        } else {
          // Oddiy muzey bo'ylab yurish rejimi
          gallerySlots.forEach(s => { if(s.video) s.video.volume = 0.0; });
          
          if (controls) {
            controls.target.set(playerGroup.position.x, playerGroup.position.y + 0.6, playerGroup.position.z);
          }
        }

        if (bgMusic) {
          bgMusic.volume = nearMedia ? 0.04 : 0.4;
        }

        if (controls) {
          controls.update();
        }
        renderer.render(scene, camera);
      }
      animate();
    }
  </script>
</body>
</html>
