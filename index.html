<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>3D Muzey Boshqaruv Paneli</title>
  <style>
    body { margin: 0; overflow: hidden; background: #0d0814; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; touch-action: none; color: white; }
    #canvas-container { width: 100vw; height: 100vh; display: none; }
    
    /* Yuqori UI */
    #ui {
      position: absolute; top: 15px; width: 100%; text-align: center;
      color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,0.9); pointer-events: none; z-index: 10; display: none;
    }
    h1 { font-size: 18px; margin: 0; color: #ffdfa9; }
    p { font-size: 11px; opacity: 0.9; margin-top: 4px; }

    /* Parol va Boshqaruv Menyusi Ekrani */
    .screen-panel {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      background: #0d0814; display: flex; flex-direction: column;
      justify-content: center; align-items: center; z-index: 1000;
    }
    .panel-card {
      background: #1c1328; padding: 25px 20px; border-radius: 16px; border: 2px solid #ffdfa9;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8); text-align: center; width: 85%; max-width: 320px;
    }
    .panel-card h2 { margin-top: 0; color: #ffdfa9; font-size: 20px; margin-bottom: 15px; }
    
    .menu-btn {
      width: 100%; padding: 12px 10px; margin: 8px 0; font-size: 14px; font-weight: bold;
      border: none; border-radius: 10px; background: linear-gradient(135deg, #ffdfa9, #f3a683);
      color: #120c1f; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .menu-btn:active { transform: scale(0.96); }
    
    #password-input {
      width: 80%; padding: 12px; font-size: 16px; border-radius: 8px; border: 1px solid #ffdfa9;
      background: #100a1c; color: white; text-align: center; outline: none; margin-bottom: 12px;
    }
    #error-msg { color: #ff4d4d; font-size: 12px; font-weight: bold; display: none; margin-top: 5px; }

    /* Virtual Joystick */
    #joystick-zone {
      position: absolute; bottom: 35px; left: 25px; width: 110px; height: 110px;
      background: rgba(255, 255, 255, 0.15); border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%; touch-action: none; z-index: 10; display: none;
    }
    #joystick-knob {
      position: absolute; top: 32px; left: 32px; width: 45px; height: 45px;
      background: #ffdfa9; border-radius: 50%; box-shadow: 0 0 12px rgba(255,223,169,0.8); pointer-events: none;
    }

    #back-to-menu-btn {
      position: absolute; top: 15px; left: 15px; z-index: 99; display: none;
      background: rgba(0,0,0,0.6); color: #ffdfa9; border: 1px solid #ffdfa9;
      padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: bold; cursor: pointer;
    }

    #media-input { display: none; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

  <!-- Parol Kirish Paneli -->
  <div id="password-screen" class="screen-panel">
    <div class="panel-card">
      <h2>🔒 Maxfiy Tizim</h2>
      <input type="password" id="password-input" placeholder="Parolni kiriting..." autofocus>
      <button class="menu-btn" onclick="checkPassword()">KIRISH</button>
      <div id="error-msg">Noto'g'ri parol!</div>
    </div>
  </div>

  <!-- Asosiy Boshqaruv Menyusi -->
  <div id="dashboard-screen" class="screen-panel" style="display: none;">
    <div class="panel-card">
      <h2>🏛 Muzey Boshqaruvi</h2>
      <button class="menu-btn" onclick="enterMuseum()">🏛 Muzeyga kirish</button>
      <button class="menu-btn" onclick="createNewMuseum()">➕ Yangi muzey yaratish</button>
      <button class="menu-btn" onclick="document.getElementById('media-input').click()">✏️ Muzeyni tahrirlash (Galereya)</button>
      <button class="menu-btn" onclick="shareMuseum()">🔗 Muzeyni ulashish</button>
    </div>
  </div>

  <!-- Bosh menyuga qaytish tugmasi -->
  <button id="back-to-menu-btn" onclick="showDashboard()">↩ Menyu</button>

  <div id="ui">
    <h1>🏛 4K Shinam Muzey & Marry Me</h1>
    <p>Joystick orqali harakatlaning va eshiklardan o'ting</p>
  </div>

  <input type="file" id="media-input" accept="image/*,video/*" multiple onchange="handleFileSelect(event)">
  <div id="joystick-zone"><div id="joystick-knob"></div></div>
  <div id="canvas-container"></div>

  <audio id="bg-music" loop src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=relaxing-piano-112221.mp3"></audio>

  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      Telegram.WebApp.ready();
      Telegram.WebApp.expand();
    }

    const correctPassword = "muzey2026";
    let bgMusic = document.getElementById("bg-music");
    let controls, scene, camera, renderer;
    let gallerySlots = [];
    let currentSlotIndex = 0;
    let butterflies = [];
    let is3dInitialized = false;

    function checkPassword() {
      const input = document.getElementById("password-input").value;
      if (input === correctPassword) {
        document.getElementById("password-screen").style.display = "none";
        document.getElementById("dashboard-screen").style.display = "flex";
      } else {
        document.getElementById("error-msg").style.display = "block";
      }
    }

    function showDashboard() {
      document.getElementById("canvas-container").style.display = "none";
      document.getElementById("ui").style.display = "none";
      document.getElementById("joystick-zone").style.display = "none";
      document.getElementById("back-to-menu-btn").style.display = "none";
      document.getElementById("dashboard-screen").style.display = "flex";
      if (!bgMusic.paused) bgMusic.pause();
    }

    function enterMuseum() {
      document.getElementById("dashboard-screen").style.display = "none";
      document.getElementById("canvas-container").style.display = "block";
      document.getElementById("ui").style.display = "block";
      document.getElementById("joystick-zone").style.display = "block";
      document.getElementById("back-to-menu-btn").style.display = "block";
      
      bgMusic.play().catch(e => console.log(e));

      if (!is3dInitialized) {
        init3D();
        is3dInitialized = true;
      }
    }

    function createNewMuseum() {
      if (confirm("Yangi muzey yaratmoqchimisiz? Eski yuklangan fayllar tozalanadi.")) {
        gallerySlots.forEach(slot => {
          slot.mesh.material = new THREE.MeshBasicMaterial({ color: 0xd1c7bd });
          if(slot.video) { slot.video.pause(); slot.video = null; }
        });
        currentSlotIndex = 0;
        alert("Yangi muzey tayyor! Endi 'Muzeyni tahrirlash' tugmasi orqali yangi rasm/videolarni yuklang.");
      }
    }

    function shareMuseum() {
      const currentUrl = window.location.href;
      if (navigator.clipboard) {
        navigator.clipboard.writeText(currentUrl).then(() => {
          alert("Muzey havolasi nusxalandi! Endi uni do'stlaringizga yuborishingiz mumkin:\n" + currentUrl);
        });
      } else {
        alert("Muzey havolasi:\n" + currentUrl);
      }
    }

    function handleFileSelect(event) {
      const files = event.target.files;
      if (!files || files.length === 0) return;

      for (let i = 0; i < files.length; i++) {
        if (currentSlotIndex >= gallerySlots.length) {
          alert("Muzeydagi barcha ramkalar to'ldi!");
          break;
        }

        const file = files[i];
        const fileURL = URL.createObjectURL(file);
        const slot = gallerySlots[currentSlotIndex];

        if (file.type.startsWith('image/')) {
          const loader = new THREE.TextureLoader();
          loader.load(fileURL, (tex) => {
            tex.generateMipmaps = true;
            tex.minFilter = THREE.LinearMipmapLinearFilter;
            slot.mesh.material = new THREE.MeshBasicMaterial({ map: tex });
          });
        } else if (file.type.startsWith('video/')) {
          const vid = document.createElement('video');
          vid.src = fileURL;
          vid.crossOrigin = 'anonymous';
          vid.loop = true;
          vid.muted = false;
          vid.volume = 0.0;
          vid.play();

          const tex = new THREE.VideoTexture(vid);
          tex.minFilter = THREE.LinearFilter;
          tex.magFilter = THREE.LinearFilter;
          slot.mesh.material = new THREE.MeshBasicMaterial({ map: tex });
          slot.video = vid;
        }

        currentSlotIndex++;
      }
      alert("Fayllar muzeyga joylandi! 'Muzeyga kirish' tugmasi orqali tomosha qiling.");
    }

    function createTextSprite(text, fontSize = 70, color = "#ff4081") {
      const canvas = document.createElement('canvas');
      canvas.width = 1024; canvas.height = 512;
      const ctx = canvas.getContext('2d');
      ctx.font = `Bold ${fontSize}px sans-serif`;
      ctx.fillStyle = color;
      ctx.textAlign = "center";
      ctx.shadowColor = "rgba(255, 64, 129, 0.9)";
      ctx.shadowBlur = 20;
      ctx.fillText(text, 512, 256);
      
      const texture = new THREE.CanvasTexture(canvas);
      const spriteMat = new THREE.SpriteMaterial({ map: texture, transparent: true });
      const sprite = new THREE.Sprite(spriteMat);
      sprite.scale.set(6, 3, 1);
      return sprite;
    }

    function init3D() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x120c1a);

      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 3, 5);

      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 3));
      document.getElementById('canvas-container').appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      controls.maxPolarAngle = Math.PI / 2 - 0.02;
      controls.minDistance = 1.2;
      controls.maxDistance = 6.0;

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.95);
      scene.add(ambientLight);

      const wallMat = new THREE.MeshBasicMaterial({ color: 0xfffbf5 });
      const floorMat = new THREE.MeshBasicMaterial({ color: 0xd9c8b4 });
      const ceilingMat = new THREE.MeshBasicMaterial({ color: 0x1a1226 });

      const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), floorMat);
      floor.rotation.x = -Math.PI / 2;
      scene.add(floor);

      const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), ceilingMat);
      ceiling.position.y = 8;
      ceiling.rotation.x = Math.PI / 2;
      scene.add(ceiling);

      const wallBoxes = [];
      function createWallBlock(w, h, d, x, y, z, mat = wallMat) {
        const wall = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
        wall.position.set(x, y, z);
        scene.add(wall);
        wallBoxes.push(new THREE.Box3().setFromObject(wall));
      }

      createWallBlock(60, 8, 0.6, 0, 4, -30);
      createWallBlock(60, 8, 0.6, 0, 4, 30);
      createWallBlock(0.6, 8, 60, -30, 4, 0);
      createWallBlock(0.6, 8, 60, 30, 4, 0);

      createWallBlock(12, 8, 0.6, -24, 4, -10); 
      createWallBlock(12, 8, 0.6, -6, 4, -10);

      createWallBlock(12, 8, 0.6, 6, 4, 10);
      createWallBlock(12, 8, 0.6, 24, 4, 10);
      createWallBlock(0.6, 8, 20, 10, 4, 20);

      function createChandelier(x, z) {
        const cGroup = new THREE.Group();
        const base = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.8, 1.2, 16), new THREE.MeshBasicMaterial({ color: 0xd4af37 }));
        cGroup.add(base);
        for(let i=0; i<6; i++) {
          const crystal = new THREE.Mesh(new THREE.SphereGeometry(0.15, 8, 8), new THREE.MeshBasicMaterial({ color: 0xffffff }));
          const angle = (i/6)*Math.PI*2;
          crystal.position.set(Math.sin(angle)*0.7, -0.8, Math.cos(angle)*0.7);
          cGroup.add(crystal);
        }
        cGroup.position.set(x, 7.2, z);
        scene.add(cGroup);
      }
      createChandelier(0, -15);
      createChandelier(-18, -20);
      createChandelier(20, 20);

      const carpetGeo = new THREE.PlaneGeometry(3.5, 18);
      const carpetMat = new THREE.MeshBasicMaterial({ color: 0xd32f2f });
      const carpet = new THREE.Mesh(carpetGeo, carpetMat);
      carpet.rotation.x = -Math.PI / 2;
      carpet.position.set(20, 0.02, 19);
      scene.add(carpet);

      const bColors = [0xff4081, 0x00e5ff, 0x76ff03, 0xffea00, 0xe040fb];
      for(let i=0; i<20; i++) {
        const bMat = new THREE.MeshBasicMaterial({ color: bColors[i % bColors.length], side: THREE.DoubleSide });
        const butterfly = new THREE.Mesh(new THREE.PlaneGeometry(0.35, 0.35), bMat);
        butterfly.position.set(12 + Math.random()*14, 1 + Math.random()*3.5, 12 + Math.random()*14);
        scene.add(butterfly);
        butterflies.push({ mesh: butterfly, speed: 0.02 + Math.random()*0.02, offset: Math.random()*100 });
      }

      const marryGroup = new THREE.Group();
      marryGroup.position.set(20, 0, 26);

      const szText = createTextSprite("S + Z", 110, "#ff2a6d");
      szText.position.set(0, 4.5, -2);
      marryGroup.add(szText);

      const marryText = createTextSprite("WILL YOU MARRY ME? 💍", 60, "#d4af37");
      marryText.position.set(0, 3.3, -2);
      marryGroup.add(marryText);

      const groomGroup = new THREE.Group();
      const gBody = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.35, 0.9), new THREE.MeshBasicMaterial({ color: 0x111111 }));
      gBody.position.y = 0.45; groomGroup.add(gBody);
      const gHead = new THREE.Mesh(new THREE.SphereGeometry(0.2, 16, 16), new THREE.MeshBasicMaterial({ color: 0xffdbac }));
      gHead.position.y = 1.0; groomGroup.add(gHead);
      groomGroup.position.set(-0.6, 0, 0);
      marryGroup.add(groomGroup);

      const brideGroup = new THREE.Group();
      const bDress = new THREE.Mesh(new THREE.ConeGeometry(0.65, 1.2, 16), new THREE.MeshBasicMaterial({ color: 0xffffff }));
      bDress.position.y = 0.6; brideGroup.add(bDress);
      const bHead = new THREE.Mesh(new THREE.SphereGeometry(0.2, 16, 16), new THREE.MeshBasicMaterial({ color: 0xffdbac }));
      bHead.position.y = 1.3; brideGroup.add(bHead);
      brideGroup.position.set(0.6, 0, 0);
      marryGroup.add(brideGroup);

      const emojiSprite = createTextSprite("♥️ 🔥 🥰 💖 💞", 70, "#ff1744");
      emojiSprite.position.set(0.6, 2.3, 0);
      marryGroup.add(emojiSprite);

      scene.add(marryGroup);

      const playerGroup = new THREE.Group();
      const body = new THREE.Mesh(new THREE.SphereGeometry(0.5, 32, 32), new THREE.MeshBasicMaterial({ color: 0x5b6570 }));
      body.scale.set(1, 1.1, 0.95); body.position.y = 0.55; playerGroup.add(body);
      const belly = new THREE.Mesh(new THREE.SphereGeometry(0.42, 32, 32), new THREE.MeshBasicMaterial({ color: 0xf5f5f5 }));
      belly.scale.set(0.85, 0.95, 0.6); belly.position.set(0, 0.52, 0.22); playerGroup.add(belly);
      const beak = new THREE.Mesh(new THREE.SphereGeometry(0.1, 16, 16), new THREE.MeshBasicMaterial({ color: 0xffcc00 }));
      beak.scale.set(1.2, 0.7, 1); beak.position.set(0, 0.58, 0.46); playerGroup.add(beak);
      const eyeMat = new THREE.MeshBasicMaterial({ color: 0x050505 });
      const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.06, 16, 16), eyeMat); eyeL.position.set(-0.16, 0.65, 0.42); playerGroup.add(eyeL);
      const eyeR = new THREE.Mesh(new THREE.SphereGeometry(0.06, 16, 16), eyeMat); eyeR.position.set(0.16, 0.65, 0.42); playerGroup.add(eyeR);
      playerGroup.position.set(0, 0, 0);
      scene.add(playerGroup);

      const frameMat = new THREE.MeshBasicMaterial({ color: 0x8b5a2b });
      const slotPositions = [
        { pos: [20, 3.5, 29.4], size: [3.8, 2.4], rotY: Math.PI },
        { pos: [0, 3.5, -29.6], size: [3.8, 2.4] },
        { pos: [-8, 3.5, -29.6], size: [2.5, 3.2] },
        { pos: [8, 3.5, -29.6], size: [2.5, 3.2] },
        { pos: [-20, 3.5, -29.6], size: [2.5, 3.2] },
        { pos: [20, 3.5, -29.6], size: [2.5, 3.2] },
        { pos: [-29.6, 3.5, -20], size: [2.5, 3.2], rotY: Math.PI/2 },
        { pos: [-29.6, 3.5, -12], size: [2.5, 3.2], rotY: Math.PI/2 },
        { pos: [29.6, 3.5, -20], size: [2.5, 3.2], rotY: -Math.PI/2 },
        { pos: [29.6, 3.5, -12], size: [2.5, 3.2], rotY: -Math.PI/2 }
      ];

      slotPositions.forEach(slot => {
        const itemGroup = new THREE.Group();
        const rotY = slot.rotY || 0;

        const frame = new THREE.Mesh(new THREE.BoxGeometry(slot.size[0] + 0.3, slot.size[1] + 0.3, 0.08), frameMat);
        frame.rotation.y = rotY;
        itemGroup.add(frame);

        const placeholderMat = new THREE.MeshBasicMaterial({ color: 0xd1c7bd });
        const mediaMesh = new THREE.Mesh(new THREE.PlaneGeometry(slot.size[0], slot.size[1]), placeholderMat);
        mediaMesh.position.set(0, 0, 0.05);
        mediaMesh.rotation.y = rotY;
        itemGroup.add(mediaMesh);

        itemGroup.position.set(slot.pos[0], slot.pos[1], slot.pos[2]);
        scene.add(itemGroup);

        gallerySlots.push({ mesh: mediaMesh, group: itemGroup, video: null });
      });

      const zone = document.getElementById('joystick-zone');
      const knob = document.getElementById('joystick-knob');
      let moveData = { x: 0, y: 0 };
      let isTouching = false;

      zone.addEventListener('touchstart', (e) => { isTouching = true; updateJoystick(e.touches[0]); e.stopPropagation(); });
      window.addEventListener('touchmove', (e) => { if(isTouching) { updateJoystick(e.touches[0]); e.stopPropagation(); } });
      window.addEventListener('touchend', () => {
        isTouching = false;
        knob.style.left = '32px'; knob.style.top = '32px';
        moveData = { x: 0, y: 0 };
      });

      function updateJoystick(touch) {
        const rect = zone.getBoundingClientRect();
        let dx = touch.clientX - (rect.left + rect.width / 2);
        let dy = touch.clientY - (rect.top + rect.height / 2);
        const dist = Math.sqrt(dx*dx + dy*dy);
        const maxRadius = 38;

        if (dist > maxRadius) { dx = (dx / dist) * maxRadius; dy = (dy / dist) * maxRadius; }
        knob.style.left = `${32 + dx}px`; knob.style.top = `${32 + dy}px`;
        moveData.x = dx / maxRadius; moveData.y = dy / maxRadius;
      }

      function canMoveTo(newX, newZ) {
        const playerBox = new THREE.Box3(
          new THREE.Vector3(newX - 0.5, 0, newZ - 0.5),
          new THREE.Vector3(newX + 0.5, 1.2, newZ + 0.5)
        );
        for (let i = 0; i < wallBoxes.length; i++) {
          if (playerBox.intersectsBox(wallBoxes[i])) return false;
        }
        return true;
      }

      let walkTimer = 0;
      function animate() {
        requestAnimationFrame(animate);

        if (Math.abs(moveData.x) > 0.1 || Math.abs(moveData.y) > 0.1) {
          const speed = 0.13;
          const camAngle = Math.atan2(camera.position.x - playerGroup.position.x, camera.position.z - playerGroup.position.z);
          const moveAngle = Math.atan2(moveData.x, moveData.y) + camAngle;

          const nextX = playerGroup.position.x + Math.sin(moveAngle) * speed;
          const nextZ = playerGroup.position.z + Math.cos(moveAngle) * speed;

          if (canMoveTo(nextX, playerGroup.position.z)) playerGroup.position.x = nextX;
          if (canMoveTo(playerGroup.position.x, nextZ)) playerGroup.position.z = nextZ;

          playerGroup.rotation.y = moveAngle;
          walkTimer += 0.18;
          playerGroup.rotation.z = Math.sin(walkTimer) * 0.1;
          playerGroup.position.y = Math.abs(Math.sin(walkTimer)) * 0.08;
        } else {
          playerGroup.rotation.z = 0; playerGroup.pos
