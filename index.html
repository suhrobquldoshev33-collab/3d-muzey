<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Mening 3D Ayiqcha Muzeyim</title>
    <!-- A-Frame va harakatlanish kutubxonalari -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
    <style>
      #panel {
        position: fixed;
        bottom: 15px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 9999;
        background: rgba(0, 0, 0, 0.85);
        padding: 10px 15px;
        border-radius: 12px;
        display: flex;
        gap: 12px;
        align-items: center;
      }
      video {
        width: 140px;
        height: 80px;
        border-radius: 6px;
      }
      button {
        background: #ff4757;
        color: white;
        border: none;
        padding: 8px 14px;
        border-radius: 6px;
        font-weight: bold;
        cursor: pointer;
      }
    </style>
  </head>
  <body>

    <!-- Video va Musiqa paneli -->
    <div id="panel">
      <video id="myVideo" controls playsinline>
        <source src="SIZNING_VIDEONGIZ.mp4" type="video/mp4">
      </video>
      <audio id="myAudio" loop>
        <source src="SIZNING_MUSIQANGIZ.mp3" type="audio/mpeg">
      </audio>
      <button onclick="document.getElementById('myAudio').play(); alert('Musiqa yoqildi!')">🎵 Musiqa</button>
    </div>

    <!-- 3D Sahna (AR/VR tugmalari o'chirilgan) -->
    <a-scene embedded vr-mode-ui="enabled: false">
      
      <!-- Osmon foni -->
      <a-sky color="#1e1e1e"></a-sky>

      <!-- Zamin (Pol) -->
      <a-plane position="0 0 0" rotation="-90 0 0" width="30" height="30" color="#dcdde1"></a-plane>

      <!-- Muzey Devorlari -->
      <a-box position="0 3 -15" width="30" height="6" depth="0.5" color="#f5f6fa"></a-box>
      <a-box position="0 3 15" width="30" height="6" depth="0.5" color="#f5f6fa"></a-box>
      <a-box position="-15 3 0" width="0.5" height="6" depth="30" color="#f5f6fa"></a-box>
      <a-box position="15 3 0" width="0.5" height="6" depth="30" color="#f5f6fa"></a-box>

      <!-- Devordagi rasmlar -->
      <a-image src="RASM_1.jpg" position="-5 3 -14.7" width="5" height="4"></a-image>
      <a-image src="RASM_2.jpg" position="5 3 -14.7" width="5" height="4"></a-image>

      <!-- 3D Ayiqcha modeli (Tayyor ochiq manbali ayiqcha modeli ulandi) -->
      <a-entity gltf-model="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/Bear/glTF/Bear.gltf" 
                position="0 0 -5" 
                scale="40 40 40"
                rotation="0 180 0"
                animation="property: rotation; to: 0 540 0; loop: true; dur: 8000">
      </a-entity>

      <!-- Kamera va erkin yurish boshqaruvi -->
      <a-entity id="rig" movement-controls="fly: false; speed: 0.1">
        <a-camera position="0 1.6 8">
          <a-cursor color="#00FF00"></a-cursor>
        </a-camera>
      </a-entity>

    </a-scene>
  </body>
</html>
