<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>3D Muzey</title>
  <style>
    body { margin: 0; overflow: hidden; background: #111; touch-action: none; font-family: sans-serif; }
    #canvas-container { width: 100vw; height: 100vh; }
    #ui {
      position: absolute; top: 15px; width: 100%; text-align: center;
      color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.8); pointer-events: none;
    }
    h1 { font-size: 18px; margin: 0; }
    p { font-size: 12px; opacity: 0.8; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div id="ui">
    <h1>🏛 Virtual 3D Galereya</h1>
    <p>Ekranni barmog'ingiz bilan buring</p>
  </div>
  <div id="canvas-container"></div>

  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      Telegram.WebApp.ready();
      Telegram.WebApp.expand();
    }

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a24);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1.6, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    const light = new THREE.AmbientLight(0xffffff, 0.9);
    scene.add(light);

    const wallGeo = new THREE.PlaneGeometry(12, 6);
    const wallMat = new THREE.MeshBasicMaterial({ color: 0x2a2a35, side: THREE.DoubleSide });
    const wall = new THREE.Mesh(wallGeo, wallMat);
    wall.position.z = -4;
    scene.add(wall);

    const frameGeo = new THREE.BoxGeometry(2.2, 3.2, 0.1);
    const frameMat = new THREE.MeshBasicMaterial({ color: 0xd4af37 });
    const frame = new THREE.Mesh(frameGeo, frameMat);
    frame.position.set(0, 1.6, -3.9);
    scene.add(frame);

    const photoGeo = new THREE.PlaneGeometry(2, 3);
    const photoMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const photo = new THREE.Mesh(photoGeo, photoMat);
    photo.position.set(0, 1.6, -3.84);
    scene.add(photo);

    let isDragging = false;
    let previousTouchX = 0;

    document.addEventListener('touchstart', (e) => {
      isDragging = true;
      previousTouchX = e.touches[0].clientX;
    });

    document.addEventListener('touchmove', (e) => {
      if (!isDragging) return;
      const deltaX = e.touches[0].clientX - previousTouchX;
      camera.rotation.y += deltaX * 0.005;
      previousTouchX = e.touches[0].clientX;
    });

    document.addEventListener('touchend', () => { isDragging = false; });

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();
  </script
