<html lang="uz">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>3D Shinam Muzey</title>
  <style>
    body { margin: 0; overflow: hidden; background: #0a0a0f; font-family: sans-serif; touch-action: none; }
    #canvas-container { width: 100vw; height: 100vh; }

      position: absolute; top: 15px; width: 100%; text-align: center;

    }
    h1 { font-size: 18px; margin: 0; color: #ffdfa9; }
    p { font-size: 12px; opacity: 0.8; margin-top: 4px; }
    
    /* Virtual Joystick UI */
    #joystick-zone {
      position: absolute; bottom: 30px; left: 30px; width: 120px; height: 120px;
      background: rgba(255, 255, 255, 0.15); border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%; touch-action: none; z-index: 10;
    }
    #joystick-knob {
      position: absolute; top: 35px; left: 35px; width: 50px; height: 50px;
      background: rgba(255, 223, 169, 0.8); border-radius: 50%;
      box-shadow: 0 0 10px rgba(255,223,169,0.5); pointer-events: none;
    }
  </style>

    if (window.Telegram && window.Telegram.WebApp) {
      Telegram.WebApp.ready();
      Telegram.WebApp.expand();

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x120c1f);
    scene.fog = new THREE.FogExp2(0x120c1f, 0.05);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    const floorGeo = new THREE.PlaneGeometry(30, 30);
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x3d251e, roughness: 0.4 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    const wallMat = new THREE.MeshStandardMaterial({ color: 0x2a1b28, roughness: 0.8 });
    const backWall = new THREE.Mesh(new THREE.PlaneGeometry(30, 10), wallMat);
    backWall.position.set(0, 5, -15);
    scene.add(backWall);

    const playerGroup = new THREE.Group();

    const bodyGeo = new THREE.SphereGeometry(0.5, 16, 16);
    bodyGeo.scale(1, 1.3, 0.9);
    const bodyMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.position.y = 0.65;
    playerGroup.add(body);

    // Qorin
    const bellyGeo = new THREE.SphereGeometry(0.4, 16, 16);
    bellyGeo.scale(0.8, 1.1, 0.5);
    const bellyMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
    const belly = new THREE.Mesh(bellyGeo, bellyMat);
    belly.position.set(0, 0.6, 0.25);
    playerGroup.add(belly);

    // Tumshuq
    const beakGeo = new THREE.ConeGeometry(0.1, 0.2, 8);
    const beakMat = new THREE.MeshStandardMaterial({ color: 0xff6600 });
    const beak = new THREE.Mesh(beakGeo, beakMat);
    beak.rotation.x = Math.PI / 2;
    beak.position.set(0, 0.85, 0.45);
    playerGroup.add(beak);

    playerGroup.position.set(0, 0, 5);
    scene.add(playerGroup);

    // 5. Shamlar
    const candles = [];
    function createCandle(x, z) {
      const candleGroup = new THREE.Group();
      const cGeo = new THREE.CylinderGeometry(0.08, 0.08, 0.4, 8);
      const cMat = new THREE.MeshStandardMaterial({ color: 0xfff8e7 });
      const candleMesh = new THREE.Mesh(cGeo, cMat);
      candleMesh.position.y = 0.2;
      candleGroup.add(candleMesh);

      const light = new THREE.PointLight(0xffaa33, 2, 5);
      light.position.y = 0.45;
      candleGroup.add(light);

      candleGroup.position.set(x, 0, z);
      scene.add(candleGroup);
      candles.push(light);
    }

    createCandle(-2, -5);
    createCandle(2, -5);
    createCandle(-5, 0);

    const pianoGroup = new THREE.Group();
    const pBody = new THREE.Mesh(new THREE.BoxGeometry(2.5, 1.2, 1), new THREE.MeshStandardMaterial({ color: 0x050505 }));
    pBody.position.y = 0.6;
    pianoGroup.add(pBody);
    pianoGroup.position.set(6, 0, -8);
    scene.add(pianoGroup);

    // 7. Rasm Ramkasi

    scene.add(frame);

    const photo = new THREE.Mesh(new THREE.PlaneGeometry(2.1, 2.9), photoMat);
    photo.position.set(-4, 4, -14.83);
    scene.add(photo);

    video.crossOrigin = 'anonymous';
    video.loop = true;
    video.muted = true;

    const videoTexture = new THREE.VideoTexture(video);
    const videoGeo = new THREE.PlaneGeometry(4, 2.5);
    const videoMat = new THREE.MeshBasicMaterial({ map: videoTexture });
    const videoMesh = new THREE.Mesh(videoGeo, videoMat);
    videoMesh.position.set(3, 4, -14.83);
    scene.add(videoMesh);

    const vFrame = new THREE.Mesh(new THREE.BoxGeometry(4.3, 2.8, 0.1), frameMat);
    vFrame.position.set(3, 4, -14.9);
    scene.add(vFrame);

      moveData = { x: 0, y: 0 };
    });
